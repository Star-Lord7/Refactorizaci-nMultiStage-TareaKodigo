name: ecommerce-stack

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_api}
      MYSQL_USER: ${MYSQL_USER:-ecommerce_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  php:
    image: ecommerce-api:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: EcommerceAPI
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8000}
      CACHE_STORE: file
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-ecommerce_api}
      DB_USERNAME: ${MYSQL_USER:-ecommerce_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - data

  api-nginx:
    build:
      context: ./backend
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:80"
    depends_on:
      php:
        condition: service_started
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LARAVEL_API_BASE_URL: http://api-nginx/api
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api-nginx:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(() => process.exit(0)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    profiles: ["tools"]
    image: ecommerce-api:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["php", "artisan", "migrate", "--force"]
    environment:
      APP_NAME: EcommerceAPI
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8000}
      CACHE_STORE: file
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-ecommerce_api}
      DB_USERNAME: ${MYSQL_USER:-ecommerce_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

volumes:
  mysql_data:

networks:
  edge:
    driver: bridge
  data:
    internal: true
